function mapView(){const current=clamp(progress.wins,0,34);return `<section class="section"><div class="sidehead"><div><div class="kicker" style="color:#ae7c14">Campanha</div><h2>Mapa da saga</h2></div><div class="chip">⭐ ${Math.min(progress.wins,35)} / 35</div></div><p class="muted">Cada capítulo tem quatro duelos e um chefão. Vitória desbloqueia uma carta informativa e avanço na campanha.</p>${CHAPTERS.map((c,i)=>{const start=i*5;let wins=clamp(progress.wins-start,0,5);const locked=progress.wins<start;return `<div class="chapter ${locked?'locked':''}"><div class="num">${locked?'🔒':i+1}</div><div class="chapter-text"><b>${esc(c[0])}</b><small>Chefão: ${FOES[c[1]].name} • ${wins}/5 duelos</small>${bar(wins,5,true)}</div>${!locked&&progress.wins<start+5?`<button class="btn btn-primary btn-small" onclick="startBattle()">${progress.wins===start+4?'CHEFÃO':'JOGAR'}</button>`:wins===5?'<span class="chip">✓ Concluído</span>':''}</div>`}).join('')}<p class="footnote">Depois da campanha completa, os desafios podem ser rejogados pelo menu da coleção (em atualização futura).</p></section>`};
function makeCard(data,isLocked=false,onclick=''){return `<div class="card ${data.faction==='villain'?'villain':''} ${isLocked?'dim':''} ${onclick?'selectable':''}" ${onclick?`role="button" tabindex="0" onclick="${onclick}" onkeydown="if(event.key==='Enter')this.click()"`:''}><div class="rank">${data.faction==='villain'?'TROPA DO CAOS':'GUARDIÃO DA AURORA'}</div><div class="symbol">${isLocked?'🔒':data.icon}</div><div class="name">${esc(isLocked?'Desbloqueie na saga':data.name)}</div><div class="desc">${esc(isLocked?'Herói ainda não disponível':data.title||data.fail||'')}</div><div class="foot"><span>⚔ ${data.atk}</span><span>❤ ${data.hp}</span><span>⚡ ${data.cost}</span></div></div>`};
function album(){return `<section class="section"><h2>📚 A coleção cósmica</h2><p class="muted">${unlocked()} heróis liberados. Os 40 personagens estão previstos na coleção. Toque nos heróis desbloqueados para escolhê-los para o seu baralho (até 12).</p><h3>☀️ Guardiões da Aurora</h3><div class="grid">${HEROES.map((h,i)=>makeCard(h,i>=unlocked(),i<unlocked()?`toggleHero(${i})`:'' )).join('')}</div><p class="footnote">Heróis selecionados: ${progress.chosen.length?progress.chosen.length:'seleção automática'}/12. Se houver menos de 12, o jogo completa o baralho com cópias.</p><h3 style="margin-top:26px">🎭 Tropa do Caos</h3><div class="grid">${FOES.map(v=>makeCard(v,false)).join('')}</div><h3 style="margin-top:26px">📜 Programas e políticas desbloqueados</h3><div class="panel">${PROGRAMS.slice(0,progress.wins).map((p,i)=>`<div class="program"><div class="book">📜</div><div><b>${i+1}. ${esc(p[0])}</b><small>${esc(p[1])}</small></div></div>`).join('')||'<p class="muted">Vença o primeiro duelo para liberar sua primeira carta informativa.</p>'}</div></section>`};
function toggleHero(i){if(i>=unlocked())return;const k=progress.chosen.indexOf(i);if(k>=0)progress.chosen.splice(k,1);else if(progress.chosen.length<12)progress.chosen.push(i);else return notify('Máximo de 12 heróis selecionados.');save();render();notify(k>=0?'Herói removido da seleção.':'Herói adicionado à seleção.');};
function info(){return `<section class="section"><div class="panel"><h2>Sobre o LULAVERSO</h2><p>Um jogo independente e fictício de estratégia por turnos, com sátira visual. Os Guardiões usam golpes épicos e a Tropa do Caos protagoniza trapalhadas. Personagens e falas são caricaturas de fantasia, não declarações reais.</p><p><b>Controles:</b> em batalha, jogue cartas da mão. Para atacar ou usar o poder, toque nos botões do herói e depois em um inimigo destacado. Quando a posição correspondente estiver vazia, escolha atacar a base. Ative armadilhas para provocar Descontrole. Finalize o turno para a IA jogar.</p><p><b>Recompensas:</b> as cartas sobre programas públicos são explicações resumidas, não aconselhamento jurídico nem atribuição de todos os programas a uma administração. Alguns nomes descrevem iniciativas históricas.</p><p><b>Votos simbólicos:</b> apenas pontos fictícios obtidos ao jogar. Não solicitamos voto real e não coletamos preferência política.</p><p>Seu progresso fica somente neste dispositivo. Instale pela opção do navegador para acesso como aplicativo.</p><button class="btn btn-ghost" onclick="toggleAudio()">🔉 Vozes originais por síntese do navegador: ${progress.music?'ligadas':'desligadas'}</button></div></section>`};
function toggleAudio(){progress.music=!progress.music;save();render()};function speak(s){if(!progress.music||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='pt-BR';u.rate=1.12;u.pitch=1.35;speechSynthesis.speak(u)}catch(e){}};
function deckCards(){let allowed=progress.chosen.filter(i=>i<unlocked());if(!allowed.length)allowed=HEROES.slice(0,unlocked()).map((_,i)=>i).slice(0,12);const out=[];while(out.length<12){out.push({...HEROES[allowed[out.length%allowed.length]],type:'hero',uid:'hero-'+out.length})}SPELLS.forEach((s,i)=>out.push({...s,uid:'spell-'+i}));TRAPS.forEach((t,i)=>out.push({...t,uid:'trap-'+i}));return out.sort(()=>Math.random()-.5)};
function stageEnemy(stage){let chapter=Math.floor(stage/5),isBoss=stage%5===4;let bossId=CHAPTERS[chapter][1];let candidates=[11,15,12,13,5,3,0,1,2,4,8,9,10,14,16,17,18,19,7,6];let heroId=isBoss?bossId:candidates[(stage*3+chapter*4)%candidates.length];let f=FOES[heroId];return {...f,uid:'enemy-'+stage,baseHp:f.hp+(isBoss?3:Math.floor(chapter/2)),hp:f.hp+(isBoss?3:Math.floor(chapter/2)),chaos:0,shield:0,stun:0,boss:isBoss}};
function startBattle(){let stage=clamp(progress.wins,0,34);let deck=deckCards();battle={stage,chapter:Math.floor(stage/5),round:1,energy:3,maxEnergy:3,patience:30,enemyPatience:stage===34?50:30,bossPhase:1,hand:deck.splice(0,5),deck,discard:[],heroes:[null,null,null],enemies:[null,null,null],traps:[],globalChaos:0,nextChaos:'Chuva de Figurinhas',boost:0,selection:null,logs:['Os Guardiões entram na arena. Prepare suas cartas.'],ended:false,enemyCount:0};battle.enemies[1]=stageEnemy(stage);if(stage%5===4){battle.enemies[0]=recruitEnemy();}else if(stage>=2)battle.enemies[2]=recruitEnemy();if(stage>=14)battle.enemies[0]??=recruitEnemy();view='battle';render()};
function recruitEnemy(){let b=battle,stage=b.stage;let idx=(b.enemyCount*7+stage*3+11)%FOES.length;b.enemyCount++;if(FOES[idx].id===FOES[CHAPTERS[b.chapter][1]].id)idx=(idx+4)%FOES.length;let f=FOES[idx];return {...f,uid:'e-'+stage+'-'+b.enemyCount,baseHp:f.hp+Math.floor(b.chapter/3),hp:f.hp+Math.floor(b.chapter/3),chaos:0,shield:0,stun:0,boss:false}};
function log(s){battle.logs.push(s);battle.logs=battle.logs.slice(-12);};function notify(s){let n=$('toast');if(n){n.textContent=s;n.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{if(n)n.style.display='none'},2000)}};
function drawCards(n){for(let k=0;k<n;k++){if(battle.hand.length>=7){log('Mão cheia: compra interrompida.');break}if(!battle.deck.length){battle.patience=Math.max(0,battle.patience-2);log('O baralho acabou! -2 Paciência.');if(!battle.patience)lose();break;}battle.hand.push(battle.deck.shift())}};
function unitHTML(u,idx,foe){if(!u)return `<div class="empty ${battle.selection&&foe?'target':''}" ${foe?`onclick="targetEnemy(${idx})"`:''}>${foe?'🎯':'✦'}<br>${foe?'Base livre':'Vazio'}</div>`;let selectable=foe&&battle.selection;return `<div class="unit ${foe?'foe':''} ${selectable?'target':''}" ${selectable?`onclick="targetEnemy(${idx})"`:''}><div class="emo">${u.icon}</div><div class="nm">${esc(u.name)}</div><div class="meters"><span class="meter">⚔ ${u.atk+(u.bonus||0)}</span><span class="meter">❤ ${Math.max(0,u.hp)}</span><span class="meter">🛡️ ${u.shield||0}</span></div>${foe?`<div class="mini" style="color:#aa2d3e;font-weight:900">${'●'.repeat(u.chaos)}${'○'.repeat(3-u.chaos)} descontrole</div>`:`<div class="control-row" style="justify-content:center;gap:4px;margin:8px 0 0"><button class="btn btn-primary btn-small" style="padding:6px" ${u.used?'disabled':''} onclick="selectAttack(${idx},'attack')">⚔️</button><button class="btn btn-red btn-small" style="padding:6px" ${u.used||battle.energy<2?'disabled':''} title="${esc(u.skill)} — 2 EN" onclick="selectAttack(${idx},'skill')">✦2</button></div>`}</div>`};
function battleView(){const b=battle;if(!b)return home();let stage=b.stage;let chapter=CHAPTERS[b.chapter][0];return `<section class="section"><div class="sidehead"><div><div class="kicker" style="color:#a56a13">CAPÍTULO ${b.chapter+1} • DUELO ${stage%5+1} / 5</div><h2 style="margin:6px 0">${esc(chapter)}</h2></div><button class="btn btn-ghost btn-small" onclick="confirmExit()">Sair</button></div><div class="battle-shell"><div class="battle-board"><div class="sidehead"><strong>🎭 TROPA DO CAOS</strong><span class="chip tag-red">Paciência ${b.enemyPatience}/${stage===34?50:30}</span></div>${bar(b.enemyPatience,stage===34?50:30,false)}<div class="slots">${b.enemies.map((e,i)=>unitHTML(e,i,true)).join('')}</div><div class="lanes">⚡ CAMPO CÓSMICO ⚡</div><div class="slots">${b.heroes.map((h,i)=>unitHTML(h,i,false)).join('')}</div>${bar(b.patience,30,true)}<div class="sidehead"><strong>★ GUARDIÕES DA AURORA</strong><span class="chip">Paciência ${b.patience}/30</span></div><div class="control-row"><span class="chip">⚡ ENERGIA ${b.energy}/${b.maxEnergy}</span><span class="chip">🔄 RODADA ${b.round}</span><span class="chip">🃏 DECK ${b.deck.length}</span></div>${b.selection?`<div class="choice"><b>🎯 Escolha um alvo!</b><p class="mini">Toque no vilão destacado ou no espaço vazio para atacar diretamente a base. <button class="btn btn-ghost btn-small" onclick="cancelSelection()">Cancelar</button></p></div>`:''}<h3>Sua mão (${b.hand.length})</h3><div class="hand">${b.hand.map((c,i)=>`<div onclick="playCard(${i})" role="button" tabindex="0" onkeydown="if(event.key==='Enter')this.click()" title="${esc(c.desc||c.skill||'')}" class="card ${c.type==='trap'?'villain':''} ${c.cost>b.energy?'dim':''}"><div class="rank">${c.type==='hero'?'GUARDIÃO':c.type==='trap'?'ARMADILHA':'PODER'}</div><div class="symbol">${c.icon}</div><div class="name">${esc(c.name)}</div><div class="desc">${esc(c.desc||c.skill||c.title||'')}</div><div class="foot"><span>⚡ ${c.cost}</span>${c.type==='hero'?`<span>⚔ ${c.atk} ❤ ${c.hp}</span>`:''}</div></div>`).join('')}</div><div class="control-row"><button class="btn btn-primary" ${b.ended?'disabled':''} onclick="enemyTurn()">Encerrar turno →</button><button class="btn btn-ghost" onclick="drawHelp()">? Como jogar</button></div></div><aside class="battle-side"><div class="panel"><h3>🔮 Próxima intenção da IA</h3><p class="muted mini">${b.round%3===0?'Fortalecer suas posições e procurar uma abertura.':'Atacar a posição mais vulnerável com possíveis habilidades especiais.'}</p><h3>💥 Caos global</h3><div class="progressbar"><div style="width:${b.globalChaos}%"></div></div><p class="mini muted">${b.globalChaos}/100 • Próximo: ${b.globalChaos>=60?esc(b.nextChaos):'revelado aos 60'}</p></div><div class="panel"><h3>🎙️ Armadilhas preparadas</h3><div class="spellfield">${b.traps.map(t=>`<span class="chip">${t.icon} ${esc(t.name)}</span>`).join('')||'<small class="muted">Nenhuma. Jogue uma carta de armadilha.</small>'}</div></div><div class="panel"><h3>📣 Narrador</h3><div class="battle-log">${b.logs.slice().reverse().map(l=>`<p>${esc(l)}</p>`).join('')}</div></div></aside></div></section>`};
function cancelSelection(){battle.selection=null;render()};function selectAttack(index,mode){if(!battle)return;let u=battle.heroes[index];if(!u||u.used)return; if(mode==='skill'&&battle.energy<2)return notify('Você precisa de 2 EN para o poder.');battle.selection={index,mode};render();notify('Escolha a posição inimiga destacada.');};
function damageEnemy(index,damage,pierce=false){let b=battle,e=b.enemies[index];if(!e){b.enemyPatience=Math.max(0,b.enemyPatience-damage);log(`Golpe direto! Tropa perde ${damage} de Paciência.`);if(b.enemyPatience===0)win();return;}let absorbed=pierce?0:Math.min(e.shield||0,damage);e.shield-=absorbed;let actual=Math.max(0,damage-absorbed);e.hp-=actual;log(`${e.name} sofre ${actual} de dano${absorbed?' ('+absorbed+' absorvidos)':''}.`);if(e.hp<=0){log(`${e.name} foi derrotado!`);b.enemies[index]=null;if(b.stage===34&&e.id==='v6'&&b.bossPhase<3){b.bossPhase++;let ne=stageEnemy(b.stage);ne.hp=ne.baseHp=10+b.bossPhase*4;ne.atk=4+b.bossPhase;b.enemies[index]=ne;log(`🦖 Tarifaossauro inicia a fase ${b.bossPhase}!`);speak('Nova fase! Tarifaossauro Supremo!')}}};
function targetEnemy(j){let b=battle,s=b?.selection;if(!b||!s)return;const u=b.heroes[s.index];if(!u||u.used){b.selection=null;render();return;}const sameLane=j===s.index;if(!b.enemies[j]&&b.enemies[s.index])return notify('Só pode atacar diretamente pela própria posição livre.');if(!sameLane&&s.mode==='attack'&&b.enemies[s.index])return notify('Ataque comum precisa atingir a mesma posição.');let damage=u.atk+(u.bonus||0)+(b.boost||0);if(s.mode==='skill'){b.energy-=2;const en=b.enemies[j];if(u.kind==='heal'){b.heroes.filter(Boolean).forEach(h=>h.hp=Math.min(h.baseHp,h.hp+2));log(`${u.name} invoca ${u.skill}: heróis recuperam vida.`);damage=1;}else if(u.kind==='shield'){u.shield=(u.shield||0)+4;log(`${u.name} ergue um escudo cósmico.`);damage=1;}else if(u.kind==='chaos'){if(en)en.chaos=Math.min(3,en.chaos+2);log(`${u.name} ativa ${u.skill}: +2 Descontrole.`);damage=2;}else if(u.kind==='draw'){drawCards(2);log(`${u.name} consulta o Cosmo e compra cartas.`);damage=1;}else if(u.kind==='stun'){if(en){en.stun=1;en.chaos=Math.min(3,en.chaos+1)}log(`${u.name} imobiliza um adversário.`);damage=2;}else if(u.kind==='boost'){b.boost+=1;log(`${u.name} fortalece os companheiros.`);damage=2;}else if(u.kind==='aoe'){b.enemies.forEach((e,i)=>{if(e)damageEnemy(i,2)});damage=1;log(`${u.name} lança uma tempestade de energia.`);}else damage+=2;};u.used=true;b.selection=null;damageEnemy(j,damage);b.globalChaos=Math.min(100,b.globalChaos+12);checkCaos();if(battle&&!b.ended)render()};
function firstEnemy(){let b=battle;return b.enemies.map((e,i)=>({e,i})).filter(x=>x.e).sort((a,c)=>a.e.hp-c.e.hp)[0]};function addChaos(n){let target=firstEnemy();if(target){target.e.chaos=Math.min(3,target.e.chaos+n);log(`${target.e.name} acumula ${n} Descontrole.`)}else log('Não há alvo para provocar descontrole.');};
function doSpell(c){let b=battle;let t=firstEnemy();if(['chaos','chaos2','stun','strike','aoe'].includes(c.kind)&&!t)return notify('Não há vilões ativos para esse poder.'),false;switch(c.kind){case 'chaos':addChaos(1);break;case 'chaos2':addChaos(2);break;case 'heal':b.heroes.filter(Boolean).forEach(h=>h.hp=Math.min(h.baseHp,h.hp+2));log('Luz restauradora! Heróis curados.');break;case 'shield':{let h=b.heroes.filter(Boolean).sort((a,c)=>a.hp-c.hp)[0];if(!h)return notify('Invoque um herói primeiro.'),false;h.shield+=4;log(`${h.name} ganhou 4 de escudo.`);break;}case 'strike':damageEnemy(t.i,4);break;case 'stun':t.e.stun=1;log(`${t.e.name} ficou atordoado.`);break;case 'aoe':b.enemies.forEach((e,i)=>{if(e)damageEnemy(i,2)});break;case 'draw':drawCards(2);log('Duas cartas compradas.');break;case 'boost':b.boost+=1;log('Aliados ganham +1 ataque nesta rodada.');break;case 'resolve':b.patience=Math.min(30,b.patience+4);log('Paciência restaurada em 4.');break;default:return false}return true};
function playCard(i){let b=battle;if(!b||b.ended)return;let c=b.hand[i];if(!c)return;if(b.selection)return notify('Finalize ou cancele a seleção de alvo.');if(c.cost>b.energy)return notify('Energia insuficiente.');if(c.type==='hero'){let j=b.heroes.findIndex(h=>!h);if(j<0)return notify('As três posições já estão ocupadas.');b.heroes[j]={...c,hp:c.hp,baseHp:c.hp,shield:0,used:true,bonus:0};log(`${c.name}, ${c.title}, entra na arena!`)}else if(c.type==='trap'){if(b.traps.length>=2)return notify('Você já tem duas armadilhas preparadas.');b.traps.push({...c,expires:b.round+3});log(`Uma armadilha foi preparada: ${c.name}.`)}else if(!doSpell(c))return;b.energy-=c.cost;b.discard.push(c);b.hand.splice(i,1);b.globalChaos=Math.min(100,b.globalChaos+7);checkCaos();if(battle&&!b.ended)render()};
function triggerTrap(type,enemy){let b=battle;let i=b.traps.findIndex(t=>t.trigger===type||t.trigger==='attack'&&type==='attack');if(i<0)return {cancel:false,reduce:0};let t=b.traps.splice(i,1)[0];log(`🪤 ${t.name} foi acionada!`);if(t.name==='Microfone Aberto'){enemy.chaos=Math.min(3,enemy.chaos+2);return {cancel:false,reduce:0}}if(t.name==='Câmera Frontal'){enemy.chaos=Math.min(3,enemy.chaos+1);return {cancel:false,reduce:0}}if(t.name==='Wi-Fi Caiu'||t.name==='Atualização Forçada'||t.name==='Botão Silenciar')return {cancel:true,reduce:0};if(t.name==='Pneu com GPS'){enemy.hp-=2;return {cancel:false,reduce:0}}return {cancel:false,reduce:t.name==='Escudo da Aurora'?4:3}};
function enemyTurn(){let b=battle;if(!b||b.ended)return;if(b.selection){notify('Finalize ou cancele a seleção de alvo.');return;}log(`⏳ A Tropa do Caos inicia sua resposta na rodada ${b.round}.`);for(let i=0;i<3;i++){let enemy=b.enemies[i];if(!enemy||b.ended)continue;if(enemy.hp<=0){b.enemies[i]=null;continue}if(enemy.stun){enemy.stun=0;log(`${enemy.name} perdeu a vez: atordoado.`);continue;}if(enemy.chaos>=2&&b.round%3===0){enemy.chaos=Math.max(0,enemy.chaos-2);log(`${enemy.name} tenta recuperar o controle e perde o ataque.`);continue;}let special=(b.round+i)%3===0||enemy.boss;let trig=triggerTrap(special?'special':'attack',enemy);if(trig.cancel){log(`${enemy.name} teve a habilidade cancelada!`);continue;}if(enemy.chaos>=3&&special){log(`😂 FIASCO! ${enemy.fail} A própria Tropa perde 3 de Paciência.`);speak(enemy.fail);b.enemyPatience=Math.max(0,b.enemyPatience-3);enemy.hp=Math.max(1,enemy.hp-2);enemy.chaos=0;if(b.enemyPatience===0){win();return;}continue;}let target=b.heroes[i];let dmg=enemy.atk+(special?1:0)-trig.reduce;dmg=Math.max(0,dmg);if(target){let shielded=Math.min(dmg,target.shield);target.shield-=shielded;dmg-=shielded;target.hp-=dmg;log(`${enemy.name} ataca ${target.name}: ${dmg} de dano.`);if(target.hp<=0){log(`${target.name} retorna ao Cosmo. ✨`);b.heroes[i]=null;}}else{b.patience=Math.max(0,b.patience-dmg);log(`${enemy.name} avança pela posição ${i+1}: -${dmg} Paciência.`)}if(!b.patience){lose();return;}}if(b.ended)return;if(b.round%2===0){let empty=b.enemies.findIndex(e=>!e);if(empty>=0){b.enemies[empty]=recruitEnemy();log('A Tropa recebeu um novo reforço!')}}b.round++;b.maxEnergy=Math.min(8,3+b.round-1);b.energy=b.maxEnergy;b.heroes.forEach(h=>{if(h){h.used=false;h.bonus=0}});b.boost=0;b.traps=b.traps.filter(t=>{if(t.expires<b.round){log(`${t.name} expirou.`);return false}return true});drawCards(1);b.globalChaos=Math.min(100,b.globalChaos+10);checkCaos();if(battle&&!b.ended)render()};
function checkCaos(){let b=battle;if(b.globalChaos<100||b.ended)return;b.globalChaos=0;let event=['Chuva de Figurinhas','Pneu em Órbita','Wi-Fi de Batata','Luz da Aurora'][(b.round+b.stage)%4];log(`🌩️ EVENTO DO CAOS: ${event}!`);if(event==='Chuva de Figurinhas')drawCards(1);else if(event==='Pneu em Órbita'){addChaos(1)}else if(event==='Wi-Fi de Batata'){b.enemies.forEach(e=>{if(e)e.stun=1})}else{b.patience=Math.min(30,b.patience+2)}b.nextChaos=['Chuva de Figurinhas','Pneu em Órbita','Wi-Fi de Batata','Luz da Aurora'][(b.round+b.stage+1)%4]};
function win(){let b=battle;if(!b||b.ended)return;b.ended=true;let stage=b.stage;if(stage===progress.wins){progress.wins=Math.min(35,progress.wins+1);save();}modal={type:'win',stage,program:PROGRAMS[stage]};view='home';render();speak('Vitória! Uma nova conquista foi desbloqueada!')};function lose(){if(!battle||battle.ended)return;battle.ended=true;modal={type:'lose'};render()};function confirmExit(){modal={type:'exit'};render()};function drawHelp(){modal={type:'help'};render()};function closeModal(){modal=null;render()};
function modalView(){if(!modal)return '';let m=modal;let body='';if(m.type==='win'){body=`<div class="reward"><div class="trophy">🏆</div><h2>VITÓRIA CÓSMICA!</h2><p>Nova carta informativa desbloqueada:</p><div class="choice"><div style="font-size:35px">📜</div><h2>${esc(m.program[0])}</h2><p>${esc(m.program[1])}</p></div><p class="chip">⭐ +1.250 votos simbólicos fictícios</p><p class="footnote">Pontuação inventada para a campanha; não corresponde a voto real.</p><button class="btn btn-primary" onclick="closeModal();go('map')">Continuar a saga →</button></div>`}else if(m.type==='lose')body=`<div class="reward"><div class="trophy">🛡️</div><h2>Os Guardiões recuam</h2><p>Ajuste o baralho e use as armadilhas para elevar o Descontrole dos inimigos.</p><button class="btn btn-primary" onclick="closeModal();startBattle()">Tentar novamente</button> <button class="btn btn-ghost" onclick="closeModal();go('map')">Mapa</button></div>`;else if(m.type==='exit')body=`<h2>Sair do duelo?</h2><p>O progresso da batalha atual será perdido. Suas vitórias anteriores continuarão salvas.</p><button class="btn btn-red" onclick="battle=null;closeModal();go('map')">Sair</button> <button class="btn btn-ghost" onclick="closeModal()">Continuar duelando</button>`;else if(m.type==='help')body=`<h2>Como vencer</h2><p>1. Toque nas cartas da mão para invocar heróis ou ativar poderes e armadilhas.</p><p>2. Toque em ⚔️ no seu herói e depois na posição inimiga. Se a posição estiver livre, o ataque atinge a Paciência rival.</p><p>3. Toque em ✦2 para usar o poder do herói por 2 EN.</p><p>4. Faça os vilões acumularem 3 pontos de Descontrole e prepare armadilhas para provocar fiascos.</p><p>5. Encerre o turno para a IA agir. Seu objetivo é reduzir a Paciência rival a zero.</p><button class="btn btn-primary" onclick="closeModal()">Entendi!</button>`;return `<div class="overlay"><div role="dialog" aria-modal="true" class="dialog">${body}</div></div>`};
function render(){const app=$('app');app.innerHTML=`<div class="shell">${header()}${view==='home'?home():view==='map'?mapView():view==='album'?album():view==='battle'?battleView():info()}${footer()}</div>${modalView()}<div id="toast" role="status" style="display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#322619;color:white;padding:12px 20px;border-radius:12px;z-index:40;box-shadow:0 10px 30px #0004;max-width:90%;text-align:center"></div>`};
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
